
## --- Cucumber Engine parallel execution ---
cucumber.execution.parallel.enabled=false

# Strategy: fixed thread pool (simple & predictable)
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=2

# Ensure features and scenarios can run concurrently
cucumber.execution.parallel.mode.default=concurrent
cucumber.execution.parallel.mode.features=concurrent
cucumber.execution.parallel.mode.scenarios=concurrent

# (Optional) reporting via Cucumber plugins
cucumber.plugin=pretty, html:target/cucumber-report.html, json:target/cucumber.json



