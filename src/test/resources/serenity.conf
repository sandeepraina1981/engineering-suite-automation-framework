webdriver {
  driver = edge
  autodownload = true
  capabilities {
    browserName = "MicrosoftEdge"
    acceptInsecureCerts = true
    unhandledPromptBehavior = accept

    "ms:edgeOptions" {
          args = ["start-maximized", "--inprivate", "--disable-infobars", "--disable-default-apps", "--disable-popup-blocking", "--disable-extensions-file-access-check", "--user-agent=Apache", "--proxy-server=http://fra4.sme.zscaler.net:10181", "--proxy-bypass-list=10.200.*.*"]
        }

        proxy {
            proxyType: "manual",
            httpProxy: "http://fra4.sme.zscaler.net:10181",
            sslProxy: "http://fra4.sme.zscaler.net:10181"
        }

        "ms:loggingPrefs" {browser: ALL, driver: ALL, performance: ALL}
      }
}
headless.mode = false

serenity {
  take.screenshots = FOR_EACH_ACTION
  test.root = "org.lenze.nupano.suite"
  tag.failures = "true"
  linked.tags = "issue"
  restart.browser.for.each = feature
  logging = verbose
  outputDirectory = "report"
  requirements.types = "epic,story,feature"

  project.name = "Lenze NUPANO QA Test Suite"
  compress.filenames=false

  report {
    accessibility = true
    show.manual.tests = true
    test.durations=true
  }

  reports.show.step.details = true
  hide.empty.requirements = true
  full.page.screenshot.strategy = true
}

environments {
  with_screenshots {
    serenity {
      take.screenshots = BEFORE_AND_AFTER_EACH_STEP
    }
  }
}