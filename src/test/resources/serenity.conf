webdriver {
  driver = chrome
  autodownload = true

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    unhandledPromptBehavior = accept

    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "--incognito",
        "--disable-infobars",
        "--disable-default-apps",
        "--disable-popup-blocking",
        "--disable-extensions",
        "--user-agent=Apache",
        "--proxy-server=fra4.sme.zscaler.net:10181",
        "--proxy-bypass-list=10.200.*.*",

        "--headless=new",
        "--no-sandbox",
        "--disable-dev-shm-usage",
        "--disable-gpu",
        "--remote-allow-origins=*"
      ]
    }

    proxy {
      proxyType = "manual"
      httpProxy = "fra4.sme.zscaler.net:10181"
      sslProxy  = "fra4.sme.zscaler.net:10181"
    }

    "goog:loggingPrefs" {
      browser = "ALL"
      performance = "ALL"
    }
  }
}
headless.mode = true

serenity {
  take.screenshots = FOR_EACH_ACTION
  test.root = "org.lenze.nupano.suite"
  tag.failures = "true"
  linked.tags = "issue"
  restart.browser.for.each = feature
  logging = verbose
  outputDirectory = "report"

  project.name = "Lenze Automated Test Framework For NUPANO Suite"
  compress.filenames=false

  report {
    accessibility = true
    show.manual.tests = true
    test.durations=true
  }

  reports.show.step.details = true
  hide.empty.requirements = true
  full.page.screenshot.strategy = true
}

environments {
  with_screenshots {
    serenity {
      take.screenshots = BEFORE_AND_AFTER_EACH_STEP
    }
  }
}