# Start Spark reporter (HTML)
extent.reporter.spark.start=true
extent.reporter.spark.out=target/extent-report/index.html
extent.reporter.spark.vieworder=Dashboard,Test,Category,Exception,Author,Device,Log
extent.reporter.spark.config=src/test/resources/extent-config.xml

# Screenshot handling (screenshots attached via scenario.attach)
screenshot.dir=target/extent-report/screenshots/
screenshot.rel.path=./screenshots/

# Optional: sets the base report folder
basefolder.name=reports/Extent-Report
basefolder.datetimepattern=d-MMM-YY HH-mm-ss

# Optional system info
systeminfo.os=Windows 11
systeminfo.user=Autotest Machine
systeminfo.env=QA