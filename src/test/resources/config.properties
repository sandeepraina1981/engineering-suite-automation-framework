# --- Playwright runtime config ---
# browserName can be: chromium | firefox | webkit
browser=chromium
# headless: true | false
headless=false
# baseUrl to navigate immediately after creating the page
baseUrl=https://practicetestautomation.com/practice-test-login/
apiBaseUrl=https://rahulshettyacademy.com
trace=on      # off|on|retain-on-failure|on-first-retry
screenshotPolicy=on  # off|on|only-on-failure
# ms
defaultTimeout=30000
# Cucumber tag expression for local runs (CI usually overrides)
tagExpression=@smoke or @p1 or @p2 or @p3
# Optional: per-env toggles
video=off                 # off|on|retain-on-failure
# ms
slowMo=0