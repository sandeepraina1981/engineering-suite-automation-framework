serenity {
    take.screenshots = FOR_EACH_ACTION
    test.root = "com.lenze.engineeringsuites.qa.tests"
    logging = VERBOSE
    console.colors = true
    reports = ["html", "json"]
}

playwright {
    browser = "msedge"
    headless = true
    # channel = "msedge" # Options: chrome, msedge, etc.
}

environments {
    default {
        base.url = "https://qa.engineeringsuites.lenze.com"
        api.url = "https://api-qa.engineeringsuites.lenze.com"
    }
    dev {
        base.url = "https://dev.engineeringsuites.lenze.com"
        api.url = "https://api-dev.engineeringsuites.lenze.com"
    }
    qa {
        base.url = "https://qa.engineeringsuites.lenze.com"
        api.url = "https://api-qa.engineeringsuites.lenze.com"
    }
    prod {
        base.url = "https://engineeringsuites.lenze.com"
        api.url = "https://api.engineeringsuites.lenze.com"
    }
}

xray {
    cloud {
        client_id = ${XRAY_CLIENT_ID}
        client_secret = ${XRAY_CLIENT_SECRET}
    }
}
